version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: testgenai-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testgenai

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testgenai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: